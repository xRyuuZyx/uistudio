name: UIStudio
version: '${project.version}'
main: id.roleplay.uistudio.UIStudio
api-version: '1.21'
softdepend: [PlaceholderAPI, Vault, Nexo, RoleplayJobs, RoleplayHUD]
description: Studio UI - HUD, layar GUI, animasi, resource pack otomatis, editor in-game

commands:
  uistudio:
    description: UIStudio
    aliases: [uis]
    usage: /uistudio <open|list|reload|editor|hud|pack|preview>

permissions:
  uistudio.admin:
    default: op
